name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build libOxCryptoWrapper.dylib
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Show Xcode version
      run: |
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-path

    - name: Build dylib
      run: |
        clang -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=12.0 \
          -fPIC -dynamiclib \
          -install_name @rpath/libOxCryptoWrapper.dylib \
          -framework Foundation \
          -framework Security \
          -o libOxCryptoWrapper.dylib \
          OxCryptoWrapper.m \
          -ObjC

    - name: Verify dylib
      run: |
        echo "=== Binary Information ==="
        file libOxCryptoWrapper.dylib
        echo ""
        echo "=== Architecture ==="
        lipo -info libOxCryptoWrapper.dylib
        echo ""
        echo "=== Linked Libraries ==="
        otool -L libOxCryptoWrapper.dylib
        echo ""
        echo "=== Exported Symbols ==="
        nm -gU libOxCryptoWrapper.dylib

    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: libOxCryptoWrapper-dylib
        path: libOxCryptoWrapper.dylib
        retention-days: 30

    - name: Create build info
      run: |
        echo "Build Date: $(date)" > build-info.txt
        echo "GitHub Run: ${{ github.run_number }}" >> build-info.txt
        echo "Commit: ${{ github.sha }}" >> build-info.txt
        echo "Xcode Version: $(xcodebuild -version | head -n 1)" >> build-info.txt

    - name: Upload build info
      uses: actions/upload-artifact@v4
      with:
        name: build-info
        path: build-info.txt
        retention-days: 30
